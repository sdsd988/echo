spring:
  application:
    name: echo-customer-api

  # PostgreSQL (docker-compose로 기동). 비밀번호는 환경변수로만 주입한다(평문 미커밋).
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:echo}
    username: ${POSTGRES_USER:echo}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # 스키마는 Flyway가 만든다. Hibernate는 검증만 한다.
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  # Flyway 마이그레이션 — classpath:db/migration/V*.sql
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

# Swagger UI — http://localhost:8080/swagger-ui.html
springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health, info
