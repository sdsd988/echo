<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Echo</title>
  <style>
    :root {
      --bg: #0f0f10;
      --surface: #1a1a1c;
      --border: #2c2c2f;
      --text: #e7e7e8;
      --muted: #8a8a8f;
      --accent: #6d8eff;
      --danger: #ff6b6b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      line-height: 1.5;
    }
    .wrap {
      max-width: 600px;
      margin: 0 auto;
      padding: 24px 16px 80px;
    }
    header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    h1 { font-size: 28px; margin: 0; letter-spacing: -0.5px; }
    .sub { color: var(--muted); font-size: 13px; }

    .composer {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 28px;
    }
    textarea {
      width: 100%;
      min-height: 84px;
      resize: vertical;
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 16px;
      font-family: inherit;
      outline: none;
    }
    textarea::placeholder { color: var(--muted); }
    .composer-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 8px;
      border-top: 1px solid var(--border);
      padding-top: 10px;
    }
    .counter { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
    .counter.warn { color: #ffb84d; }
    .counter.over { color: var(--danger); }
    button {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 20px;
      padding: 8px 18px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    button.ghost {
      background: transparent;
      color: var(--danger);
      border: 1px solid var(--border);
    }

    .section-title { font-size: 16px; margin: 0 0 12px; color: var(--muted); font-weight: 600; }
    .follow-row { display: flex; gap: 12px; margin-bottom: 4px; }
    .follow-row label {
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1;
      font-size: 12px;
      color: var(--muted);
    }
    .follow-row input {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 15px;
      font-family: inherit;
      padding: 8px 10px;
      outline: none;
    }
    .follow-row input:focus { border-color: var(--accent); }
    .actions { display: flex; gap: 8px; }
    .follow-status { font-size: 13px; color: var(--muted); }
    .follow-status.ok { color: var(--accent); }
    .follow-status.err { color: var(--danger); }

    .feed-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .feed-head h2 { font-size: 16px; margin: 0; color: var(--muted); font-weight: 600; }
    .refresh {
      background: none;
      color: var(--muted);
      padding: 4px 8px;
      font-size: 13px;
      font-weight: 500;
    }

    .post {
      border-bottom: 1px solid var(--border);
      padding: 14px 4px;
    }
    .post-meta {
      display: flex;
      gap: 8px;
      align-items: baseline;
      margin-bottom: 4px;
    }
    .author { font-weight: 600; font-size: 14px; }
    .time { color: var(--muted); font-size: 12px; }
    .post-content { white-space: pre-wrap; word-break: break-word; }

    .post-actions { margin-top: 8px; }
    .like-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 20px;
      padding: 4px 12px;
      font-size: 13px;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: color 0.15s, border-color 0.15s, background 0.15s;
    }
    .like-btn:hover:not(:disabled) { border-color: var(--danger); color: var(--danger); }
    .like-btn.liked {
      background: rgba(255, 107, 107, 0.12);
      border-color: var(--danger);
      color: var(--danger);
    }
    .like-count { font-variant-numeric: tabular-nums; }

    .empty, .error {
      text-align: center;
      color: var(--muted);
      padding: 40px 0;
      font-size: 14px;
    }
    .error { color: var(--danger); }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Echo</h1>
      <span class="sub">텍스트 한 줄, 그대로 울림</span>
    </header>

    <section class="composer">
      <textarea id="content" placeholder="지금 무슨 생각을 하고 있나요?" maxlength="280"></textarea>
      <div class="composer-bar">
        <span id="counter" class="counter">0 / 280</span>
        <button id="submit" disabled>게시</button>
      </div>
    </section>

    <section class="composer">
      <h2 class="section-title">팔로우</h2>
      <div class="follow-row">
        <label>내 ID
          <input id="meId" type="number" min="1" value="1" />
        </label>
        <label>대상 ID
          <input id="targetId" type="number" min="1" value="2" />
        </label>
      </div>
      <div class="composer-bar">
        <span id="followStatus" class="follow-status">데모 유저: 1=alice · 2=bob · 3=carol</span>
        <div class="actions">
          <button id="unfollowBtn" class="ghost">언팔로우</button>
          <button id="followBtn">팔로우</button>
        </div>
      </div>
    </section>

    <div class="feed-head">
      <h2>타임라인</h2>
      <button id="refresh" class="refresh">새로고침</button>
    </div>
    <div id="feed"></div>
  </div>

  <script>
    const MAX = 280;
    const $content = document.getElementById("content");
    const $counter = document.getElementById("counter");
    const $submit = document.getElementById("submit");
    const $feed = document.getElementById("feed");
    const $refresh = document.getElementById("refresh");

    // 280자 카운터 + 게시 버튼 활성화 제어
    function updateCounter() {
      const len = $content.value.length;
      $counter.textContent = `${len} / ${MAX}`;
      $counter.classList.toggle("warn", len > MAX - 40 && len <= MAX);
      $counter.classList.toggle("over", len > MAX);
      $submit.disabled = len === 0 || len > MAX;
    }

    // ApiResponse → data 추출 (실패 시 throw)
    async function unwrap(res) {
      let body = null;
      try { body = await res.json(); } catch (_) { /* 본문 없음 */ }
      if (!res.ok || (body && body.success === false)) {
        const msg = (body && body.message) || `요청 실패 (${res.status})`;
        const err = new Error(msg);
        err.status = res.status;
        throw err;
      }
      return body ? body.data : null;
    }

    function formatTime(iso) {
      if (!iso) return "";
      const d = new Date(iso);
      if (isNaN(d)) return iso;
      return d.toLocaleString("ko-KR", {
        month: "long", day: "numeric",
        hour: "2-digit", minute: "2-digit"
      });
    }

    function escapeHtml(s) {
      const div = document.createElement("div");
      div.textContent = s ?? "";
      return div.innerHTML;
    }

    function renderFeed(items) {
      if (!items || items.length === 0) {
        $feed.innerHTML = `<div class="empty">아직 글이 없어요. 첫 글을 남겨보세요.</div>`;
        return;
      }
      // 응답이 이미 최신순이지만, 안전하게 createdAt 기준 내림차순 정렬
      const sorted = [...items].sort(
        (a, b) => new Date(b.createdAt) - new Date(a.createdAt)
      );
      $feed.innerHTML = sorted.map(p => {
        const liked = likedSet.has(likeKey(p.postId));
        return `
        <article class="post">
          <div class="post-meta">
            <span class="author">@user${escapeHtml(String(p.authorId))}</span>
            <span class="time">${escapeHtml(formatTime(p.createdAt))}</span>
          </div>
          <div class="post-content">${escapeHtml(p.content)}</div>
          <div class="post-actions">
            <button class="like-btn${liked ? " liked" : ""}" data-post-id="${escapeHtml(String(p.postId))}">
              <span>♥</span>
              <span class="like-count">…</span>
            </button>
          </div>
        </article>`;
      }).join("");

      // 각 글의 좋아요 수를 서버에서 새로 채워 넣는다
      sorted.forEach(p => refreshLikeCount(p.postId));
    }

    async function loadTimeline() {
      try {
        const res = await fetch("/timeline");
        const data = await unwrap(res);
        renderFeed(data);
      } catch (e) {
        $feed.innerHTML = `<div class="error">타임라인을 불러오지 못했어요: ${escapeHtml(e.message)}</div>`;
      }
    }

    async function submitPost() {
      const content = $content.value.trim();
      if (!content || content.length > MAX) return;
      $submit.disabled = true;
      try {
        const res = await fetch("/posts", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ content })
        });
        await unwrap(res);
        $content.value = "";
        updateCounter();
        await loadTimeline();
      } catch (e) {
        alert("게시 실패: " + e.message);
        $submit.disabled = false;
      }
    }

    // ── 팔로우 / 언팔로우 ──────────────────────────────────────────
    const $meId = document.getElementById("meId");
    const $targetId = document.getElementById("targetId");
    const $followBtn = document.getElementById("followBtn");
    const $unfollowBtn = document.getElementById("unfollowBtn");
    const $followStatus = document.getElementById("followStatus");

    function setFollowStatus(msg, kind) {
      $followStatus.textContent = msg;
      $followStatus.classList.toggle("ok", kind === "ok");
      $followStatus.classList.toggle("err", kind === "err");
    }

    // POST/DELETE /follows/{대상} — 주체는 X-User-Id 헤더로 식별
    async function callFollow(method) {
      const me = $meId.value.trim();
      const target = $targetId.value.trim();
      if (!me || !target) {
        setFollowStatus("내 ID와 대상 ID를 모두 입력하세요.", "err");
        return;
      }
      $followBtn.disabled = true;
      $unfollowBtn.disabled = true;
      setFollowStatus("요청 중…", "");
      try {
        const res = await fetch(`/follows/${encodeURIComponent(target)}`, {
          method,
          headers: { "X-User-Id": me }
        });
        await unwrap(res);
        const verb = method === "POST" ? "팔로우" : "언팔로우";
        setFollowStatus(`@user${escapeHtml(me)} → @user${escapeHtml(target)} ${verb}했어요.`, "ok");
      } catch (e) {
        // 상태코드별 친절한 메시지(서버 기본 에러 본문엔 message가 없을 수 있음)
        const friendly = {
          400: "자기 자신은 팔로우할 수 없어요.",
          404: "존재하지 않는 유저예요.",
          409: "이미 팔로우 중이에요."
        }[e.status];
        setFollowStatus(friendly || e.message, "err");
      } finally {
        $followBtn.disabled = false;
        $unfollowBtn.disabled = false;
      }
    }

    $followBtn.addEventListener("click", () => callFollow("POST"));
    $unfollowBtn.addEventListener("click", () => callFollow("DELETE"));

    // ── 좋아요 / 좋아요 취소 ───────────────────────────────────────
    // 좋아요 주체는 위 "내 ID"(meId)를 X-User-Id로 재사용한다.
    // "내가 눌렀는지" 조회 API는 없으므로, 누른 상태는 클라이언트가 (me:postId) 키로 기억하고
    // 좋아요 수는 매번 서버에서 새로 받아 정확성을 보장한다.
    const likedSet = new Set();
    const currentMe = () => $meId.value.trim() || "1";
    const likeKey = (postId) => `${currentMe()}:${postId}`;

    // GET /posts/{postId}/likes/count — 해당 버튼의 수 표시를 갱신
    async function refreshLikeCount(postId) {
      const $btn = $feed.querySelector(`.like-btn[data-post-id="${postId}"]`);
      if (!$btn) return;
      const $count = $btn.querySelector(".like-count");
      try {
        const res = await fetch(`/posts/${encodeURIComponent(postId)}/likes/count`);
        const data = await unwrap(res);
        $count.textContent = data ? data.count : 0;
      } catch (_) {
        $count.textContent = "-";
      }
    }

    // POST/DELETE /posts/{postId}/likes — 누른 상태를 토글
    async function toggleLike(postId) {
      const $btn = $feed.querySelector(`.like-btn[data-post-id="${postId}"]`);
      if (!$btn) return;
      const wasLiked = likedSet.has(likeKey(postId));
      $btn.disabled = true;
      try {
        const res = await fetch(`/posts/${encodeURIComponent(postId)}/likes`, {
          method: wasLiked ? "DELETE" : "POST",
          headers: { "X-User-Id": currentMe() }
        });
        try {
          await unwrap(res);
        } catch (e) {
          // 이미 좋아요한 상태(409)면 누른 상태로 동기화하고 넘어간다
          if (e.status !== 409) throw e;
        }
        if (wasLiked) likedSet.delete(likeKey(postId));
        else likedSet.add(likeKey(postId));
        $btn.classList.toggle("liked", likedSet.has(likeKey(postId)));
        await refreshLikeCount(postId);
      } catch (e) {
        const friendly = { 404: "삭제됐거나 없는 게시물이에요." }[e.status];
        alert("좋아요 처리 실패: " + (friendly || e.message));
      } finally {
        $btn.disabled = false;
      }
    }

    // 피드는 매번 새로 그려지므로 이벤트 위임으로 처리
    $feed.addEventListener("click", (e) => {
      const $btn = e.target.closest(".like-btn");
      if ($btn) toggleLike($btn.dataset.postId);
    });

    $content.addEventListener("input", updateCounter);
    // Cmd/Ctrl + Enter 로 빠른 게시
    $content.addEventListener("keydown", (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key === "Enter") submitPost();
    });
    $submit.addEventListener("click", submitPost);
    $refresh.addEventListener("click", loadTimeline);

    updateCounter();
    loadTimeline();
  </script>
</body>
</html>
